name: CI

on:
  push:
    branches: [main, "feature/**", "staging/**", "candidate/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -e ".[test]"

      - name: Verify bilingual documentation
        run: python scripts/check_bilingual_docs.py

      - name: Verify Markdown links
        run: python scripts/check_doc_links.py

      - name: Verify commit message format
        run: python scripts/check_commit_messages.py

      - name: Verify publication policy
        run: python scripts/check_publication_policy.py

      - name: Run tests
        run: python -m pytest -q -p no:cacheprovider

      - name: Compile Python sources
        run: python -m compileall -q app dataset benchmark scripts

      - name: Shell syntax
        run: bash -n kaggle/*.sh scripts/*.sh

      - name: Whitespace
        run: git diff --check
